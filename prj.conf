# ==============================================================================
# BKIT ARM4 (STM32F407ZGT6 on stm32f4_disco base) - Smart Elevator Firmware
# Zephyr RTOS v4.4.0
# ==============================================================================

# --- Core Kernel, Static Multithreading & Priority Inheritance ---
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_REBOOT=y

# --- Serial Console & Interactive Shell over USART1 (PA9/PA10 RS232) ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="bkit-elev:~$ "
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_STATS=y
CONFIG_STATS_SHELL=y

# --- Logging (kept lean so RS232 shell + $TWIN packets stay clean) ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_CMDS=y

# --- Onboard Hardware Peripherals ---
# GPIO (LED3 PE4, Y0/Y1 PE5/PE6, Opto X0..X3 PA6/PA7/PC4/PC5, SPI latches PD3/PG6)
CONFIG_GPIO=y

# PWM Buzzer (PF8 TIM13_CH1)
CONFIG_PWM=y

# ADC1 (PC2 LM35, PC1 Potentiometer, PC0 Light, PB0 Voltage, PB1 Current)
CONFIG_ADC=y

# Shared SPI1 (PB3/4/5 -> 74HC595 Display + Keypad) & SPI2 (PB12..15 -> W25Q64)
CONFIG_SPI=y

# Shared I2C1 (PB6/PB7 -> DS3231 RTC via I2C regs + AT24C512 EEPROM driver)
CONFIG_I2C=y
CONFIG_EEPROM=y

# CAN1 (PB8/PB9 -> TJA1050 500 kbps), RTR support & EEPROM Integrity CRC
CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80
CONFIG_CAN_MANUAL_RECOVERY_MODE=y
CONFIG_CAN_ACCEPT_RTR=y
CONFIG_CRC=y

# Independent Watchdog (IWDG) & Hardware Info (Reset cause / MCU UID)
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_HWINFO=y

# Output artifacts
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y
